plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositorie// s.
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"waterbucket" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	// In-game test: ./gradlew runClientGameTest starts a real client, creates a
	// singleplayer world and drives the panic key (src/gametest).
	configureTests {
		createSourceSet = true
		modId = "waterbucket-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"


	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	dependencies {
		modApi "com.terraformersmc:modmenu:17.0.0-beta.2"
	}

	// Cloth Config builds the settings screen (ModConfigScreen). Players don't need it,
	// fabric.mod.json only suggests it; it is here so the screen compiles and the dev
	// client has it.
	modApi("me.shedaniel.cloth:cloth-config-fabric:21.11.153") {
		exclude(group: "net.fabricmc.fabric-api")
	}

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// ---------------------------------------------------------------------------
// Releasing (see CONTRIBUTING.md): pushing a tag such as 1.4.3-mc1.21.11 runs
// .github/workflows/release.yml, which calls ./gradlew publishMods. That
// uploads the jar to Modrinth, CurseForge and a GitHub release, with the
// matching CHANGELOG.md section as the release notes, and replaces the
// Modrinth description with README.md. Without all three tokens it is a dry
// run: nothing is uploaded and the requests are written to build/publishMods.
// ---------------------------------------------------------------------------

static String changelogSection(File changelog, String version) {
	def text = changelog.getText("UTF-8").normalize()
	def matcher = text =~ /(?ms)^(## \[${java.util.regex.Pattern.quote(version)}\].*?)(?=^## \[|\z)/
	if (!matcher.find()) {
		throw new GradleException("CHANGELOG.md has no '## [${version}]' section")
	}
	return matcher.group(1).trim()
}

// README.md as a store description: the parts between <!-- github-only --> and
// <!-- /github-only --> are dropped, and <!-- listing-only ... --> comments are
// unwrapped (the embedded video, which GitHub can't show).
static String listingDescription(File readme) {
	def text = readme.getText("UTF-8").normalize()
	text = text.replaceAll(/(?s)<!-- github-only -->.*?<!-- \/github-only -->\n?/, "")
	text = text.replaceAll(/(?s)<!-- listing-only\n(.*?)\n-->/, '$1')
	return text.trim() + "\n"
}

// CurseForge's Markdown has no iframes, <kbd> or <details>: it shows them as
// text. Its copy drops the video (CurseForge already shows the project's video
// above the description) and uses code spans and an unfolded command table.
static String curseforgeDescription(String listing) {
	def text = listing
	text = text.replaceAll(/<iframe[^>]*><\/iframe>\n*/, "")
	text = text.replaceAll(/<kbd>(.*?)<\/kbd>/, '`$1`')
	text = text.replaceAll(/(?s)<details>\s*<summary>.*?<\/summary>\s*\n/, "")
	text = text.replaceAll(/\n?<\/details>\n/, "")
	return text
}

tasks.register("listingDescription") {
	group = "publishing"
	description = "Writes the store descriptions made from README.md: build/listing-description.md (what Modrinth gets) and build/curseforge-description.md (paste into CurseForge in Markdown mode)."
	def readme = file("README.md")
	def modrinthOutput = layout.buildDirectory.file("listing-description.md")
	def curseforgeOutput = layout.buildDirectory.file("curseforge-description.md")
	inputs.file(readme)
	outputs.files(modrinthOutput, curseforgeOutput)
	doLast {
		def listing = listingDescription(readme)
		modrinthOutput.get().asFile.setText(listing, "UTF-8")
		curseforgeOutput.get().asFile.setText(curseforgeDescription(listing), "UTF-8")
	}
}

def releaseVersion = project.mod_version.tokenize("+")[0]
def releaseMinecraftVersions = project.publish_minecraft_versions.split(",").collect { it.trim() }
def missingToken = ["MODRINTH_TOKEN", "CURSEFORGE_TOKEN", "GITHUB_TOKEN"].any { System.getenv(it) == null || System.getenv(it).isEmpty() }

publishMods {
	file = remapJar.archiveFile
	displayName = "Water Bucket Extinguish ${project.mod_version}"
	version = project.mod_version
	type = STABLE
	modLoaders.add("fabric")
	changelog = providers.provider { changelogSection(file("CHANGELOG.md"), releaseVersion) }
	dryRun = missingToken || System.getenv("PUBLISH_DRY_RUN") == "true"

	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		projectId = "oyLBBIDr"
		minecraftVersions.addAll(releaseMinecraftVersions)
		environment = CLIENT_ONLY
		projectDescription = providers.provider { listingDescription(file("README.md")) }
		requires("fabric-api")
		optional("cloth-config")
		optional("modmenu")
	}

	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		projectId = "1467538"
		projectSlug = "water-bucket-extinguish"
		minecraftVersions.addAll(releaseMinecraftVersions)
		// The Java level the classes are compiled for (options.release), not the toolchain.
		javaVersions.add(tasks.named("compileJava").flatMap { it.options.release }.map { JavaVersion.toVersion(it) })
		client = true
		server = false
		requires("fabric-api")
		optional("cloth-config")
		optional("modmenu")
	}

	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = "RpYTMc/WaterBucketExtinguish"
		// Only used when the tag doesn't exist yet; GitHub Actions always sets GITHUB_SHA.
		commitish = providers.environmentVariable("GITHUB_SHA")
				.orElse(providers.exec { commandLine("git", "rev-parse", "HEAD") }.standardOutput.asText.map { it.trim() })
		tagName = providers.environmentVariable("GITHUB_REF_NAME").orElse(project.mod_version.replace("+", "-"))
	}
}
